<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HydroCare 水耕蔬菜看板</title>
<style>
:root{--bg:#f3f6f3;--card:#fff;--ink:#1b2a21;--sub:#4f5f56;--line:#d9e3db;--leaf:#2b7a4b;--leaf-d:#1d5736;--leaf-bg:#e5f2e9;--water:#1d6a8f;--sun:#9a5b00;--sun-bg:#fcefd6}
*{box-sizing:border-box}
html{font-size:112.5%;-webkit-text-size-adjust:100%}
html.lg{font-size:137.5%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.7}
.wrap{max-width:68rem;margin:0 auto;padding:0 1rem}
h1,h2,p{margin:0}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}

/* 頂部 */
.top{background:#fff;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;gap:.75rem 1.5rem;align-items:center;justify-content:space-between;padding-top:.75rem;padding-bottom:.75rem}
.brand b{display:block;font-size:1.15rem}
.brand span{font-size:.85rem;color:var(--sub)}
.tools{display:flex;flex-wrap:wrap;gap:.5rem}
.btn{min-height:3rem;padding:.4rem 1rem;border:2px solid var(--line);border-radius:.6rem;background:#fff;color:var(--ink);font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--leaf)}
.btn[aria-pressed=true]{background:var(--leaf-bg);border-color:var(--leaf);color:var(--leaf-d)}
.btn.primary{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.primary:hover{background:var(--leaf-d)}

main{padding:1.25rem 0 2.5rem;display:grid;gap:1.25rem}
section{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1.25rem}
h2{font-size:1.25rem;line-height:1.4}
.meta{color:var(--sub);font-size:.9rem}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.25rem 1rem;align-items:baseline;margin-bottom:1rem}

/* 今日 */
.today{display:grid;gap:1rem 2rem;grid-template-columns:1fr;background:var(--leaf-d);color:#fff;border:0}
.today .date{font-size:2.4rem;font-weight:800;line-height:1.2}
.today .sub{opacity:.85;margin-top:.25rem}
.today .wx{border-top:1px solid rgba(255,255,255,.3);padding-top:1rem}
.today .wx b{font-size:1.4rem}
.today .hi{margin-top:.5rem;font-size:1.1rem}
@media(min-width:48rem){.today{grid-template-columns:1.2fr 1fr}.today .wx{border-top:0;border-left:1px solid rgba(255,255,255,.3);padding:0 0 0 2rem}.today .date{font-size:3rem}}

/* 生長進度 */
.track{height:.9rem;border-radius:1rem;background:var(--leaf-bg);overflow:hidden}
.track i{display:block;height:100%;background:var(--leaf);border-radius:1rem}
.stages{list-style:none;margin:1rem 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.stages li{padding:.6rem .5rem;border-radius:.6rem;text-align:center;font-size:.85rem;color:var(--sub);border:1px dashed var(--line)}
.stages b{display:block;font-size:1rem}
.stages .done{border-style:solid;color:var(--leaf-d);background:var(--leaf-bg);border-color:var(--leaf-bg)}
.stages .now{border:2px solid var(--leaf);background:#fff;color:var(--ink);font-weight:700}

/* 巡檢 */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem}
@media(min-width:48rem){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:.9rem;border-radius:.6rem;background:var(--bg)}
.stat dt{font-size:.9rem;color:var(--sub)}
.stat dd{margin:0}
.stat .v{font-size:1.9rem;font-weight:800;line-height:1.3;color:var(--water)}
.stat .v small{font-size:.9rem;font-weight:500;color:var(--sub)}
.stat .n{font-size:.85rem;color:var(--sub)}

/* 活動 */
.events{list-style:none;margin:0;padding:0}
.events li{display:grid;grid-template-columns:4.5rem 1fr;gap:1rem;padding:1rem 0;border-top:1px solid var(--line)}
.events li:first-child{border-top:0;padding-top:0}
.day{text-align:center;border-radius:.6rem;background:var(--sun-bg);color:var(--sun);padding:.4rem 0;align-self:start}
.day b{display:block;font-size:1.8rem;line-height:1.1}
.day span{font-size:.85rem}
.events h3{margin:0;font-size:1.1rem}
.empty{color:var(--sub)}

/* 相簿 */
.status{padding:.6rem .9rem;border-radius:.6rem;background:var(--sun-bg);color:var(--sun);font-size:.9rem;margin-bottom:1rem}
.status.ok{background:var(--leaf-bg);color:var(--leaf-d)}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr))}
.ph{border:1px solid var(--line);border-radius:.8rem;overflow:hidden}
.ph .img{height:10rem;display:grid;place-items:center;font-size:3.5rem;background:linear-gradient(135deg,#dff0e4,#d4e9f1);transition:filter .3s}
.ph.lock .img{filter:blur(10px)}
.ph .cap{padding:.75rem}
.ph .cap b{display:block;font-size:1rem}
.ph .btn{margin-top:.5rem;min-height:2.6rem;width:100%}

/* 對話框 */
dialog{border:0;border-radius:1rem;padding:0;width:min(26rem,calc(100% - 2rem));color:var(--ink);box-shadow:0 12px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,30,25,.6)}
dialog form{padding:1.25rem;display:grid;gap:1rem}
label{display:grid;gap:.25rem;font-weight:600;font-size:.95rem}
input{font:inherit;min-height:3rem;padding:.4rem .75rem;border:2px solid var(--line);border-radius:.6rem}
.err{color:#b3261e;font-size:.9rem;min-height:1.4em}
.row{display:flex;gap:.5rem;justify-content:flex-end}
footer{text-align:center;color:var(--sub);font-size:.8rem;padding:0 1rem 2rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><b id="center"></b><span>水耕蔬菜看板</span></div>
    <div class="tools">
      <button class="btn" id="speak" type="button">朗讀今日資訊</button>
      <button class="btn" id="big" type="button" aria-pressed="false">大字</button>
      <button class="btn" id="tv" type="button">大螢幕</button>
      <button class="btn primary" id="unlock" type="button">家屬看原圖</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="today" aria-label="今日資訊">
    <div>
      <div class="date" id="date"></div>
      <p class="sub" id="timeline"></p>
      <p class="hi" id="hello"></p>
    </div>
    <div class="wx">
      <p class="meta" style="color:inherit;opacity:.85" id="wxPlace"></p>
      <p><b id="wxTemp"></b> <span id="wxHum"></span></p>
      <p id="wxTip"></p>
    </div>
  </section>

  <section aria-labelledby="g">
    <div class="head">
      <h2 id="g">這一期的菜：<span id="veg"></span></h2>
      <p class="meta" id="gMeta"></p>
    </div>
    <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar"><i id="fill"></i></div>
    <ol class="stages" id="stages"></ol>
  </section>

  <section aria-labelledby="c">
    <div class="head">
      <h2 id="c">本週水質檢查</h2>
      <p class="meta" id="cMeta"></p>
    </div>
    <dl class="stats" id="stats" style="margin:0"></dl>
  </section>

  <section aria-labelledby="e">
    <div class="head"><h2 id="e">近期活動</h2><p class="meta">歡迎家屬一起參加</p></div>
    <ul class="events" id="events"></ul>
  </section>

  <section aria-labelledby="a">
    <div class="head"><h2 id="a">活動相片</h2></div>
    <p class="status" id="albumStatus" role="status"></p>
    <div class="grid" id="album"></div>
  </section>
</main>

<footer>MVP 示範版，畫面資料為範例</footer>

<dialog id="dlg" aria-labelledby="dt">
  <form id="form" method="dialog">
    <div><h2 id="dt">家屬查看原圖</h2><p class="meta">請輸入機構提供的長輩姓名與查閱編號。</p></div>
    <label>長輩姓名<input id="fName" autocomplete="off" placeholder="例：王小明"></label>
    <label>查閱編號<input id="fCode" autocomplete="off" placeholder="例：HC-0001" style="text-transform:uppercase"></label>
    <p class="meta">示範用：王小明 / HC-0001</p>
    <p class="err" id="err" role="alert"></p>
    <div class="row">
      <button class="btn" type="button" id="cancel">取消</button>
      <button class="btn primary" type="submit">確認</button>
    </div>
  </form>
</dialog>

<script>
/* ===== 設定區：之後改成後端 API 回傳即可 ===== */
const CONFIG = {
  center: "平安日間照顧中心",
  hello: "心有綠意，四季常春。今天也一起照顧我們的菜。",
  weather: { place: "示範地點", temp: 22, hum: 68, tip: "天氣涼爽，外出請加件薄外套。" }, // TODO: 串接中央氣象署開放資料（建議用 Cloudflare Worker 代理 API key）
  crop: { name: "綠橡木萵苣", sow: "2026-11-02", harvest: "2026-11-28" },
  inspection: { when: "昨天 15:30", tech: "林技師" },
  stats: [
    { k: "水箱水量", v: 88, u: "%", n: "已補水、清洗完成" },
    { k: "水溫", v: 21.4, u: "°C", n: "適合生長" },
    { k: "酸鹼值 pH", v: 6.2, u: "", n: "在正常範圍" },
    { k: "養分濃度 EC", v: 1.4, u: "mS/cm", n: "在正常範圍" }
  ],
  events: [
    { date: "2026-11-28", time: "10:00–11:30", title: "親手採收萵苣，做蔬菜捲", desc: "長輩親手採收，搭配彩椒與低糖胡麻醬一起享用。" },
    { date: "2026-12-05", time: "14:00", title: "水耕種子點點樂", desc: "用安全鑷子把種子放進海綿，練習手眼協調。" }
  ],
  photos: [
    { e: "🌿", cap: "「這菜葉摸起來好嫩！」", when: "3 天前", file: "" },
    { e: "💧", cap: "一起檢查水流順不順", when: "5 天前", file: "" },
    { e: "🥗", cap: "上一期收成的蔬菜沙拉", when: "上個月", file: "" }
  ],
  /* 示範用。正式上線必須由後端驗證，且模糊圖與原圖要分開存放，不能只靠前端 CSS。 */
  family: [{ name: "王小明", code: "HC-0001" }]
};

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const DAY = 864e5;
const ymd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
let unlocked = false;

/* 今日 */
$("center").textContent = CONFIG.center;
document.title = CONFIG.center + "｜水耕蔬菜看板";
$("date").textContent = now.toLocaleDateString("zh-TW", { month: "long", day: "numeric", weekday: "long" });
const season = ["冬", "冬", "春", "春", "春", "夏", "夏", "夏", "秋", "秋", "秋", "冬"][now.getMonth()];
const part = h => h < 12 ? "上午" : h < 18 ? "下午" : "晚上";
function tick() { const d = new Date(); $("timeline").textContent = `現在是${season}天的${part(d.getHours())} ` + d.toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", hour12: false }); }
tick(); setInterval(tick, 30000);
$("hello").textContent = CONFIG.hello;
const w = CONFIG.weather;
$("wxPlace").textContent = w.place + "天氣";
$("wxTemp").textContent = w.temp + "°C";
$("wxHum").textContent = "濕度 " + w.hum + "%";
$("wxTip").textContent = w.tip;

/* 生長進度 */
const c = CONFIG.crop, sow = ymd(c.sow), hv = ymd(c.harvest);
const total = Math.round((hv - sow) / DAY);
const elapsed = Math.min(total, Math.max(1, Math.floor((today - sow) / DAY) + 1));
const left = Math.round((hv - today) / DAY);
const pct = Math.round(elapsed / total * 100);
$("veg").textContent = c.name;
$("gMeta").textContent = left > 0 ? `第 ${elapsed} 天，預計 ${hv.getMonth() + 1}/${hv.getDate()} 採收，還有 ${left} 天` : "今天可以採收了";
$("fill").style.width = pct + "%";
$("bar").setAttribute("aria-valuenow", pct);
$("bar").setAttribute("aria-label", "生長進度 " + pct + "%");
const stages = [["育苗", "海綿育苗", .2], ["移栽", "上架移栽", .45], ["茂盛", "葉片長大", .9], ["採收", "收成享用", 9]];
const cur = left <= 0 ? 3 : stages.findIndex(s => elapsed / total < s[2]);
stages.forEach((s, i) => {
  const li = el("li", i < cur ? "done" : i === cur ? "now" : "");
  li.append(el("b", null, s[0] + "期"), document.createTextNode(s[1]));
  if (i === cur) li.setAttribute("aria-current", "step");
  $("stages").append(li);
});

/* 水質檢查 */
$("cMeta").textContent = `${CONFIG.inspection.when}，${CONFIG.inspection.tech}現場檢測`;
CONFIG.stats.forEach(s => {
  const box = el("div", "stat");
  const dt = el("dt", null, s.k), dd = el("dd");
  const v = el("div", "v", String(s.v)); if (s.u) v.append(el("small", null, " " + s.u));
  dd.append(v, el("div", "n", s.n)); box.append(dt, dd); $("stats").append(box);
});

/* 活動 */
const up = CONFIG.events.filter(x => ymd(x.date) >= today).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 3);
if (!up.length) $("events").append(el("li", "empty", "目前沒有安排活動，有新活動會公告在這裡。"));
up.forEach(x => {
  const d = ymd(x.date), li = el("li"), day = el("time", "day");
  day.dateTime = x.date; day.append(el("b", null, String(d.getDate())), el("span", null, (d.getMonth() + 1) + "月"));
  const body = el("div"); body.append(el("h3", null, x.title), el("p", "meta", x.time), el("p", null, x.desc));
  li.append(day, body); $("events").append(li);
});

/* 相簿 */
function renderAlbum() {
  const st = $("albumStatus");
  st.className = "status" + (unlocked ? " ok" : "");
  st.textContent = unlocked ? "已解鎖：目前顯示清晰原圖" : "為保護長輩肖像，相片已模糊處理。家屬可按上方「家屬看原圖」解鎖。";
  $("album").replaceChildren(...CONFIG.photos.map(p => {
    const f = el("figure", "ph" + (unlocked ? "" : " lock")); f.style.margin = 0;
    f.append(el("div", "img", p.e));
    const cap = el("figcaption", "cap"); cap.append(el("b", null, p.cap), el("span", "meta", p.when));
    if (unlocked) { const b = el("button", "btn", "下載原圖"); b.type = "button"; b.onclick = () => { $("albumStatus").textContent = "示範版尚未上傳原圖檔"; }; cap.append(b); }
    f.append(cap); return f;
  }));
}
renderAlbum();

/* 家屬解鎖 */
const dlg = $("dlg");
$("unlock").onclick = () => { $("err").textContent = ""; dlg.showModal(); $("fName").focus(); };
$("cancel").onclick = () => dlg.close();
$("form").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("fName").value.trim(), code = $("fCode").value.trim().toUpperCase();
  if (!name || !code) { $("err").textContent = "請填寫姓名和編號。"; return; }
  if (!CONFIG.family.some(f => f.name === name && f.code === code)) { $("err").textContent = "姓名與編號不符，請確認機構給您的通知卡。"; return; }
  unlocked = true; dlg.close(); renderAlbum();
  $("unlock").textContent = "已解鎖原圖"; $("unlock").disabled = true;
});

/* 大字、全螢幕、朗讀 */
function setBig(on) {
  document.documentElement.classList.toggle("lg", on);
  $("big").setAttribute("aria-pressed", on);
  try { localStorage.setItem("hc-big", on ? "1" : "0"); } catch (e) {}
}
try { setBig(localStorage.getItem("hc-big") === "1"); } catch (e) {}
$("big").onclick = () => setBig($("big").getAttribute("aria-pressed") !== "true");
$("tv").onclick = () => {
  if (document.fullscreenElement) { document.exitFullscreen(); return; }
  setBig(true);
  document.documentElement.requestFullscreen?.().catch(() => {});
};
$("speak").onclick = () => {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const t = `今天是${$("date").textContent}。${w.tip}${$("gMeta").textContent}。`;
  const u = new SpeechSynthesisUtterance(t); u.lang = "zh-TW"; u.rate = .9; speechSynthesis.speak(u);
};
</script>
</body>
</html>
